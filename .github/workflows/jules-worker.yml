name: Jules Continuous Worker

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'automation/tasks.json'
      - 'automation/config.json'

concurrency:
  group: jules-worker-orchestration
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  run-worker:
    name: Execute Jules Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Run Jules Orchestrator Worker
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python automation/worker.py

      - name: Commit updated backlog state
        run: |
          git config user.name "jules-automation[bot]"
          git config user.email "jules-automation[bot]@users.noreply.github.com"
          git add automation/tasks.json automation/memory.json automation/config.json
          git diff --staged --quiet || git commit -m "chore(automation): update backlog, memory and evolved guidelines [skip ci]"
          # Attempt push to current branch; fallback to automation-state branch if main is protected
          git push origin HEAD:${{ github.ref }} || git push origin HEAD:refs/heads/automation-state || echo "State saved in run context"
